name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Dev-only Postgres from deploy/compose.dev.yaml (fixed dev password, loopback); tests create
  # per-test databases (pair_t_*_<uuid>).
  DATABASE_URL: postgres://pair:pair@127.0.0.1:55432/pair
  # Runner psql/pg_dump may be older than the server; ops scripts use the container's matching tools.
  PAIR_PG_MODE: docker

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: postgres (dev compose override)
        working-directory: .
        run: docker compose -f deploy/compose.dev.yaml up -d --wait postgres
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch head; re-pin when bumping
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: service
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: smoke (boot the service, check auth contract)
        working-directory: .
        env:
          PAIR_SMOKE_PORT: "18080"
        run: scripts/check smoke
      - name: ops script tests (restore, backup, retention, pgtools, compose, openclaw gate)
        working-directory: .
        run: |
          for t in scripts/tests/*.sh; do bash "$t"; done
      - name: restore drill (seeded scratch database)
        working-directory: .
        env:
          PAIR_BACKUP_UNENCRYPTED: "1"
        run: scripts/restore-drill --seed-demo

  supply-chain:
    # Non-blocking: advisories should be visible but must not gate merges.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch head; re-pin when bumping
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file service/Cargo.lock
      - name: cargo deny
        # Skipped (not failed) when the repo has no deny.toml yet.
        run: |
          if [ -f deny.toml ] || [ -f service/deny.toml ]; then
            cargo install cargo-deny --locked
            cd service && cargo deny check
          else
            echo "no deny.toml; skipping cargo deny"
          fi
