# PAIR tool policy (spec section 9). Parsed by pair_policy::PolicyConfig; any parse or
# validation error means no policy engine exists, so every action is refused (fail closed).
# Unknown keys are rejected. Bump `version` whenever this file changes.
version: "2026-10-03.6"

# Risk class per registered tool. A tool that is not listed here is denied.
# read | local_edit | local_commit run unprompted inside the workspace;
# external_write | high_risk need a single-use approval bound to the exact payload.
tools:
  fs.read: read
  fs.search: read
  fs.write: local_edit
  fs.edit: local_edit
  shell.exec: local_edit
  # Research workflow (pair_workflows::tools). Read-only, but the destination host is
  # checked against `egress` below, so a host that is not listed is denied.
  web.search: read
  web.fetch: read
  git.commit: local_commit
  message.send: external_write
  git.push: external_write
  pr.create: external_write
  calendar.modify_event: external_write
  pr.merge: high_risk
  deploy.run: high_risk
  fs.delete_recursive: high_risk
  payment.send: high_risk

# Executables a request may name. Anything else is denied.
executables_allow: [git, cargo, rustc, python3, uv, node, npm, pnpm, ls, cat, grep, rg, sed, make]

# The allowlist above is NOT a code-execution boundary. These can run arbitrary code (build
# scripts, proc macros, interpreters, Makefiles, package scripts) and are denied unless the
# policy engine was built with `with_sandbox()` (i.e. the command runs inside the worker
# container). Fixed-purpose tools are validated per command line in pair_policy::exec_rules:
# git (status/diff/log/show/add/commit/worktree/rev-parse/ls-files/update-index only, no
# -c/--upload-pack/--exec-path/config keys), sed (print/delete/s without e/w), rg (no --pre).
code_exec: [cargo, rustc, python3, uv, node, npm, pnpm, make]

# Host credential locations; `~` is the real home directory. Must not be empty.
denied_paths:
  - "~/.ssh"
  - "~/.aws"
  - "~/.azure"
  - "~/.config/gcloud"
  - "~/.kube"
  - "~/.gnupg"
  - "~/.docker"
  - "~/.netrc"
  - "~/.git-credentials"
  - /var/run/docker.sock
  - /run/docker.sock

# Credential file names denied wherever they appear (case-insensitive; `*.ext` matches a suffix).
# Templates that hold no secrets and stay readable despite the `.env.*` pattern (exact names only).
allowed_names: [".env.example", ".env.sample", ".env.template", ".env.dist"]

denied_names:
  - ".envrc"
  - ".env"
  - ".env.local"
  - ".env.development"
  - ".env.staging"
  - ".env.production"
  - ".env.test"
  - ".env.*"                  # any other variant: .env.prod, .env.dev, .env.backup, .env.bak, ...
  - "*.env"                   # production.env, secrets.env, ... (templates are `.env.example`, see allowed_names)
  - ".git-credentials"
  - id_rsa
  - id_ed25519
  - id_ecdsa
  - id_dsa
  - kubeconfig
  - "*.tfvars"
  - "*.jks"

# Default-deny egress: a destination passes only if a rule names its host, data class, scheme
# and port. Hosts are exact lowercase, or `*.example.com` for subdomains only. `schemes`
# defaults to [https]; `ports` defaults to the default port of the scheme in use (443 https, 22 ssh).
egress:
  - { host: api.github.com, data_classes: [public, personal] }
  - { host: github.com, data_classes: [public, personal], schemes: [https, ssh] }
  - { host: static.crates.io, data_classes: [public] }
  - { host: index.crates.io, data_classes: [public] }
  - { host: pypi.org, data_classes: [public] }
  - { host: files.pythonhosted.org, data_classes: [public] }

# Research sources (web.fetch) and the search service (web.search) are public data only.
# Add the hosts you trust here; nothing is reachable by default. Example:
#   - { host: docs.rs, data_classes: [public] }
#   - { host: "*.wikipedia.org", data_classes: [public] }
