# DEV ONLY. Throwaway local Postgres with the fixed development password `pair`, bound to
# loopback. Never use these credentials for staging or production: use deploy/compose.yaml,
# which refuses to start without POSTGRES_PASSWORD.
#
#   docker compose -f deploy/compose.dev.yaml up -d --wait
#
# This is a standalone file rather than an override on purpose: Compose interpolates every file
# before merging, so an override cannot satisfy the `${POSTGRES_PASSWORD:?...}` requirement of
# deploy/compose.yaml. The service, volume and project name match compose.yaml so the data
# volume is shared between the two. Keep image tag and healthcheck in sync with it.
name: deploy
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: pair
      POSTGRES_PASSWORD: pair   # dev-only password
      POSTGRES_DB: pair
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pair"]
      interval: 3s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
