# Staging/production-shaped stack. No default credentials: POSTGRES_PASSWORD must be set
# (compose refuses to start without it). For local development use deploy/compose.dev.yaml.
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pair}
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pair}"]
      interval: 3s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]
  # PAIR API service. Opt-in: `docker compose --profile app up -d --wait`.
  # Build is not exercised by CI yet; image tags must be immutable in staging/prod.
  pair-api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    image: pair-api:${PAIR_IMAGE_TAG:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pair}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pair}
      PAIR_SERVICE_TOKEN: ${PAIR_SERVICE_TOKEN:-}  # required (>=16 chars); the service refuses to start without it
      PAIR_BIND: 0.0.0.0:8080
      # Migrations and models.yaml are baked into the image (see deploy/api/Dockerfile);
      # the paths are explicit so a missing file fails startup instead of reading as ready.
      PAIR_MIGRATIONS_DIR: /app/migrations
      PAIR_MODELS_CONFIG: /app/config/models.yaml
      PAIR_DATA_DIR: /var/lib/pair
      # Optional: provider and approver credentials. Empty means unset (see config/api.yaml).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      PAIR_APPROVER_TOKEN: ${PAIR_APPROVER_TOKEN:-}
      # /v1/policy/authorize resolves every path against THIS root on the container's own
      # filesystem. Empty (the default) means authorize denies everything, which is safe but makes
      # the OpenClaw adapter unusable. To enable it, set the variable to the absolute path of the
      # agent workspace AND bind-mount that same host path read-only at the same path, e.g. in an
      # override file:  volumes: ["/home/me/work:/home/me/work:ro"].  Without the matching mount the
      # path checks run against a directory that does not exist in the container.
      PAIR_WORKSPACE_ROOT: ${PAIR_WORKSPACE_ROOT:-}
      RUST_LOG: info
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - pairdata:/var/lib/pair
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/pair-api", "--healthcheck"]
      interval: 5s
      retries: 12
    restart: unless-stopped
volumes:
  pgdata:
  pairdata:
