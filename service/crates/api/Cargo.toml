[package]
name = "pair-api"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "pair-api"
path = "src/main.rs"

[dependencies]
pair-core = { path = "../core" }
pair-telemetry = { path = "../telemetry" }
pair-models = { path = "../models" }
pair-budget = { path = "../budget" }
pair-policy = { path = "../policy" }
pair-jobs = { path = "../jobs" }
pair-context = { path = "../context" }
pair-workflows = { path = "../workflows" }
sha2 = "0.10"
serde_yaml_ng = "0.10"
axum = "0.8"
subtle = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
uuid.workspace = true
tracing.workspace = true
chrono.workspace = true
sqlx.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
