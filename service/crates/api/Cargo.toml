async-trait.workspace = true
uuid.workspace = true
tracing.workspace = true
chrono.workspace = true
sqlx.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
